include ./theme.conf

# Custom kitty config
shell	zsh
allow_remote_control yes

# Hyprland maps SUPER+C/V to Ctrl+C/V for Mac-like shortcuts across GUI apps.
# These make that translation behave naturally inside kitty too.
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard

# BEGIN_KITTY_FONTS
font_family      family="Hack Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS
