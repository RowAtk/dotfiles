include ./theme.conf

# Custom kitty config
shell	zsh
allow_remote_control yes

# Native terminal shortcuts: Ctrl+Shift+C/V; Ctrl+C remains interrupt.

# BEGIN_KITTY_FONTS
font_family      family="Hack Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

include ~/.local/state/charcoal-copper/kitty.conf
